name: 'CI'

on: [push]

jobs:

  test:
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 45
    steps:

      - uses: 'actions/checkout@v4'

      - uses: 'actions/setup-python@v5'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 'Install dependencies and check that script runs with expected error message'
        env:
          AZUL_DEBUG: '0'
          AWS_DEFAULT_REGION: 'us-east-1'
          PYTHONPATH: 'src'
        run: |
          pip install -r requirements.txt

          # Run the export script, should bomb due to no credentials, not a dependency issue
          python scripts/export_inspector_findings.py 2>&1 | grep -n2 "Unable to locate credentials"
